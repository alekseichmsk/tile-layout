<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Раскладка плитки</title>
<style>
:root{--bg:#f4f5f9;--card:#fff;--tx:#14161a;--mu:#6b7280;--ac:#4f46e5;--ac2:#eef2ff;--bd:#e5e7eb;--in:#f8f9fb;--sh:0 4px 20px rgba(17,24,39,.06),0 1px 3px rgba(17,24,39,.05);--cv:#eceef3}
@media(prefers-color-scheme:dark){:root{--bg:#0e1015;--card:#181b22;--tx:#eef0f4;--mu:#9aa1ad;--ac:#818cf8;--ac2:#232744;--bd:#2a2e38;--in:#11141a;--sh:0 4px 20px rgba(0,0,0,.35);--cv:#22252d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;overflow-x:hidden}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;padding-bottom:84px}
header{padding:18px 18px 6px;font-size:22px;font-weight:700;letter-spacing:-.02em}header small{color:var(--mu);font-weight:500}
.sub{padding:0 18px 8px;color:var(--mu);font-size:14px}
.tab{display:none}.tab.on{display:block}
.card,#inp,#wrap{background:var(--card);margin:10px 12px;border-radius:16px;box-shadow:var(--sh);border:1px solid var(--bd)}
.card{padding:14px 16px;font-size:15px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.g h4{grid-column:1/-1;margin:8px 0 -2px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);font-weight:600}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mu);gap:6px;font-weight:500}
input:not([type=range]),select{font:inherit;font-size:18px;font-weight:600;color:var(--tx);padding:12px 14px;border:1.5px solid var(--bd);border-radius:12px;width:100%;min-width:0;background:var(--in);outline:none}
input:focus{border-color:var(--ac)}
.full{grid-column:1/-1}
.seg{display:flex;gap:4px;background:var(--in);border:1px solid var(--bd);border-radius:12px;padding:4px}
.seg button{flex:1;font:inherit;font-size:14px;font-weight:600;padding:10px 4px;border:0;background:transparent;color:var(--mu);border-radius:9px}
.seg button.on{background:var(--card);color:var(--ac);box-shadow:0 1px 4px rgba(0,0,0,.12)}
input[type=range]{width:100%;accent-color:var(--ac);height:40px}
#wrap{overflow:hidden;position:relative}
svg{display:block;width:100%;touch-action:none;background:var(--cv)}
#zr{position:absolute;right:10px;top:10px;font:inherit;font-size:13px;font-weight:600;padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.card table{width:100%;border-collapse:collapse}.card td{padding:8px 2px;border-bottom:1px solid var(--bd)}.card td:last-child{text-align:right}
.card h4{margin:14px 0 4px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.warn{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4);padding:10px 12px;margin:10px 0;border-radius:12px;font-size:14px}
.lg span{display:inline-block;width:12px;height:12px;vertical-align:middle;margin:0 4px 0 10px;border-radius:3px;border:1px solid var(--bd)}
.hint{font-size:12px;color:var(--mu);padding:6px 16px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 12px}.kpi div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;box-shadow:var(--sh)}
.kpi b{display:block;font-size:24px;color:var(--ac)}.kpi span{font-size:12px;color:var(--mu)}
.lgi{display:grid;grid-template-columns:32px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}.lgi>b{background:#fdba74;color:#111827;border-radius:8px;text-align:center;padding:4px 0}.lgi em{font-style:normal;font-weight:700}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}#dlg[hidden]{display:none}
#dlb{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;font-size:14px}
#dlb table{width:100%;border-collapse:collapse}#dlb td{padding:7px 2px;border-bottom:1px solid var(--bd);vertical-align:top}#dlb td:last-child{text-align:right}#dlb h4{margin:14px 0 4px;font-size:13px;color:var(--mu);text-transform:uppercase}
.dh{display:flex;gap:12px;align-items:center;margin-bottom:10px}.dh button{margin-left:auto;font-size:20px;border:0;background:var(--in);color:var(--tx);border-radius:12px;width:44px;height:44px}
.badge{background:#fdba74;color:#111827;border-radius:12px;padding:8px 14px;font-size:22px}.mu{color:var(--mu);font-size:13px}
.seq{font-size:13px;padding:6px 0;border-bottom:1px solid var(--bd);line-height:1.5}.lgi{cursor:pointer}
.rr{display:flex;gap:8px;margin:6px 0}.rr select,.rr input{flex:1;min-width:0}.rr button{font:inherit;font-weight:600;font-size:14px;border:0;border-radius:12px;padding:10px 12px;background:var(--ac2);color:var(--ac);white-space:nowrap}
.cm{display:flex;flex-direction:row;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}.cm input{width:24px;height:24px;flex:none;margin:0}.cm.done{opacity:.45;text-decoration:line-through}
@media print{nav,header .sub,#zr,#rooms,#inp,.rr,.kpi{display:none!important}.tab{display:block!important}body{padding:0;background:#fff}.card,#wrap{box-shadow:none;break-inside:avoid}svg{height:auto!important}}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--bd);z-index:5}
nav button{flex:1;font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;color:var(--mu);padding:8px 0;border-radius:12px}
nav button.on{background:var(--ac2);color:var(--ac)}nav i{display:block;font-style:normal;font-size:20px}
</style></head><body>
<header>Раскладка плитки <small>v8</small></header><div class="sub">Симметрично от центра, размеры в мм</div>
<section class="tab" id="t0"><div class="card" id="rooms"><h4 style="margin-top:0">Помещения</h4><div class="rr"><select id="rsel"></select><button id="rload">Открыть</button><button id="rdel">✕</button></div><div class="rr"><input id="rname" placeholder="Название (Кухня…)"><button id="rsave">Сохранить</button></div></div><div id="inp"><div class="g">
<h4>Помещение</h4>
<label>Длина (по горизонтали)<input id="rl" inputmode="numeric"></label>
<label>Ширина (по вертикали)<input id="rw" inputmode="numeric"></label>
<h4>Плитка</h4>
<label>Длина плитки<input id="tl" inputmode="numeric"></label>
<label>Ширина плитки<input id="tw" inputmode="numeric"></label>
<label>Шов<input id="gj" inputmode="decimal"></label>
<label>Запас, %<input id="rs" inputmode="numeric"></label>
<label>Плиток в коробке<input id="pb" inputmode="numeric"></label>
<label>Пропил (толщина реза)<input id="kf" inputmode="decimal"></label>

<label>Сверху<input id="ot" inputmode="numeric"></label>
<label>Снизу<input id="ob" inputmode="numeric"></label>
<label>Слева<input id="ol" inputmode="numeric"></label>
<label>Справа<input id="or" inputmode="numeric"></label>
<h4>Укладка</h4>
<div class="full seg" id="tys"><button data-v="0">Прямая</button><button data-v="0.5">Вразб. 1/2</button><button data-v="0.3333333">Вразб. 1/3</button></div><select id="ty" hidden><option value="0">Прямая</option><option value="0.5">Вразбежку 1/2</option><option value="0.3333333">Вразбежку 1/3</option></select>
<div class="full" style="font-size:14px;color:#555">Поворот плитки: <b id="angv" style="font-size:18px;color:#2b5d8a">0°</b>
<input type="range" id="ang" min="0" max="90" step="1" style="padding:0;height:44px;border:0">
<div class="seg" id="angq"><button data-a="0">0°</button><button data-a="45">45° (диагональ)</button><button data-a="90">90°</button></div></div>
<div class="full seg" id="cm"><button data-v="seam">Центр по шву</button><button data-v="tile">Центр по плитке</button></div>
</div></div></section><section class="tab" id="t1"><div class="kpi" id="kp"></div>
<div id="wrap"><button id="zr">⤢ Сброс</button><svg id="sv"></svg></div>
<div class="card" id="lgw"><h4 style="margin-top:0">Подрезка (буквы на чертеже)</h4><div id="lgd"></div></div><div class="hint">Двумя пальцами — масштаб, одним — сдвиг. <span class="lg"><span style="background:#fff"></span>целая<span style="background:#fdba74"></span>подрезка<span style="background:#c7cbd6"></span>отступ</span></div>
</section><section class="tab" id="t2"><div class="card" id="out"></div></section>
<nav><button data-t="0"><i>⚙︎</i>Параметры</button><button data-t="1"><i>▦</i>Чертёж</button><button data-t="2"><i>∑</i>Итог</button></nav>
<div id="dlg" hidden><div id="dlb"></div></div>
<script>
window.onerror=(m,u,l)=>{document.title='ERR '+m+' @'+l};
const $=id=>document.getElementById(id);
const F=['rl','rw','tl','tw','gj','rs','pb','kf','ot','ob','ol','or','ty'];

document.querySelectorAll('#angq button').forEach(b=>b.onclick=()=>{S.ang=b.dataset.a;$('ang').value=S.ang;upd()});

let TAB=Q.get('tab')||(localStorage.getItem('tileApp')?'1':'0');

const NS='http://www.w3.org/2000/svg';

  if(ins(c)){if(!ins(p))o.push(ix(p,c));o.push(c)}else if(ins(p))o.push(ix(p,c))}poly=o;if(!poly.length)break}

const r1=v=>Math.round(v*10)/10;
let VB=null,base=null;
function upd(){
 localStorage.setItem('tileApp',JSON.stringify(S));
 if(S.ty==='d'){S.ty='0';S.ang=45;$('ty').value='0';$('ang').value=45}
 const AN=Math.min(90,Math.max(0,+S.ang||0));$('angv').textContent=AN+'°';document.querySelectorAll('#angq button').forEach(b=>b.classList.toggle('on',+b.dataset.a==AN));
 document.querySelectorAll('#tys button').forEach(b=>b.classList.toggle('on',b.dataset.v==S.ty));
 document.querySelectorAll('#cm button').forEach(b=>b.classList.toggle('on',b.dataset.v==S.cm));
 const n=k=>Math.max(0,parseFloat(String(S[k]).replace(',','.'))||0);
 const RL=n('rl'),RW=n('rw'),R90=AN==90;let a=n('tl'),b=n('tw'),g=n('gj'),ot=n('ot'),ob=n('ob'),ol=n('ol'),or=n('or');
 const sv=$('sv');sv.innerHTML='';const out=$('out');

 if((W/(a+g))*(H/(b+g))>20000){out.innerHTML='<div class="warn">Слишком много плиток для отрисовки.</div>';return}

 if(!diag&&!R90){

  const t=AN*Math.PI/180,co=Math.cos(t),si=Math.sin(t),R=Math.hypot(W,H)/2+Math.max(a,b)*2;

   let s2=((j*sh)%1+1)%1;if(s2>0.5+1e-9&&sh!==0.3333333)s2-=1;

   const q=clip(P,0,0,W,H);if(q.length<3)continue;const ar=area(q);if(ar<1)continue;

   let L=0;for(let m=0;m<q.length;m++){const A=q[m],B=q[(m+1)%q.length];L=Math.max(L,Math.hypot(A[0]-B[0],A[1]-B[1]))}
   tiles.push({row:j,loc:q.map(([X,Y])=>{const dx=X-cx,dy=Y-cy;return[dx*co+dy*si-u,-dx*si+dy*co-v]}),p:q,ar,L,cut:ar<a*b*0.999,w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys),
    mx:xs.reduce((p,c)=>p+c)/xs.length,my:ys.reduce((p,c)=>p+c)/ys.length})}}
 }
 if(R90){[a,b]=[b,a];tiles.forEach(t=>{const xs=t.p.map(p=>p[0]),ys=t.p.map(p=>p[1]);const X0=Math.min(...xs),Y0=Math.min(...ys);t.p=[[X0,Y0],[X0+t.w,Y0],[X0+t.w,Y0+t.h],[X0,Y0+t.h]];t.ar=t.w*t.h;t.cut=t.w<a-0.05||t.h<b-0.05})}
 // draw
 const pad=Math.max(RL,RW)*0.16;base=[-pad,-pad,RL+2*pad,RW+2*pad];
 if(!VB||VB.key!==RL+'x'+RW){VB={v:base.slice(),key:RL+'x'+RW}}
 sv.setAttribute('viewBox',VB.v.join(' '));
 sv.style.height=Math.min(innerHeight*0.8,sv.clientWidth*base[3]/base[2]||400)+'px';
 const sc=Math.max(RL,RW)/1000;
 el('rect',{x:0,y:0,width:RL,height:RW,fill:'#c7cbd6',stroke:'#334155','stroke-width':4*sc},sv);
 const df=Math.max(Math.max(RL,RW)*0.03,11*base[2]/Math.max(sv.clientWidth||360,280)),dk=matchMedia('(prefers-color-scheme: dark)').matches?'#c7d2fe':'#1e293b';
 const dm=el('defs',{},sv),m2k=el('marker',{id:'dh',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse',markerUnits:'userSpaceOnUse'},dm);
 m2k.setAttribute('markerWidth',df*0.5);m2k.setAttribute('markerHeight',df*0.5);el('path',{d:'M0,0L10,5L0,10z',fill:dk},m2k);
 function dim(x1,y1,x2,y2,txt,side){const L=Math.hypot(x2-x1,y2-y1);if(L<=0)return;const vert=x1===x2;
  el('line',{x1,y1,x2,y2,stroke:dk,'stroke-width':df*0.06,'marker-start':L>df?'url(#dh)':'','marker-end':L>df?'url(#dh)':''},sv);

  if(vert)e.setAttribute('transform',`rotate(-90 ${mx} ${my})`)}

 dim(0,-o2,RL,-o2,String(RL),1);
 dim(0,-o1,ol,-o1,String(ol),1);dim(ol,-o1,RL-or,-o1,String(r1(W)),1);dim(RL-or,-o1,RL,-o1,String(or),-1);
 dim(-o2,0,-o2,RW,String(RW),1);
 dim(-o1,0,-o1,ot,String(ot),1);dim(-o1,ot,-o1,RW-ob,String(r1(H)),1);dim(-o1,RW-ob,-o1,RW,String(ob),-1);
 dim(RL+o1,0,RL+o1,ot,String(ot),-1);dim(RL+o1,RW-ob,RL+o1,RW,String(ob),-1);
 dim(0,RW+o1,ol,RW+o1,String(ol),-1);dim(RL-or,RW+o1,RL,RW+o1,String(or),-1);
 const G=el('g',{transform:`translate(${ol},${ot})`},sv);
 el('rect',{x:0,y:0,width:W,height:H,fill:'#8b93a3'},G);
 const fs=Math.max(Math.min(a,b)*0.22,Math.max(RL,RW)*0.024);
 for(const t of tiles){el('polygon',{points:t.p.map(p=>p.join(',')).join(' '),fill:t.cut?'#fdba74':'#ffffff',stroke:'#94a3b8','stroke-width':0.6*sc},G)}
 const fmin=Math.max(RL,RW)*0.004,ANr=diag?AN*Math.PI/180:0,D1=[Math.cos(ANr),Math.sin(ANr)],D2=[-D1[1],D1[0]];
 const defs=el('defs',{},sv);const mk=el('marker',{id:'ah',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:5,markerHeight:5,orient:'auto-start-reverse',markerUnits:'strokeWidth'},defs);el('path',{d:'M0,0L10,5L0,10z',fill:'#123'},mk);
 function chord(q,c,d){let lo=Infinity,hi=-Infinity;for(let m=0;m<q.length;m++){const A=q[m],B=q[(m+1)%q.length],ex=B[0]-A[0],ey=B[1]-A[1];

 h+=`<h4>Стороны куска</h4><table>`+A.Ed.map(e=>`<tr><td>P${e.i+1}–P${e.j+1} ${e.cut?'<span style="color:#be123c">(рез)</span>':'(заводская кромка)'}</td><td><b>${fm(e.len)} мм</b></td></tr>`).join('')+'</table>';
 $('dlb').innerHTML=h;$('dlg').hidden=false;$('dlb').scrollTop=0}
function rowsOf(tiles,ax){// scan lines: ax=1 horizontal lines (rows), ax=0 vertical lines
 const P=ax?1:0,Sx=ax?0:1,m=new Map();
 for(const t of tiles){const vs=t.p.map(p=>p[P]);const pos=Math.min(...vs)+(Math.max(...vs)-Math.min(...vs))*0.37,k=Math.round(pos*1000);if(!m.has(k))m.set(k,pos)}
 return[...m.values()].sort((x,y)=>x-y).map(pos=>{const r=tiles.filter(t=>{const vs=t.p.map(p=>p[P]);return Math.min(...vs)<pos&&Math.max(...vs)>pos}).map(t=>{const xs=t.p.map(p=>p[Sx]);return[Math.min(...xs),Math.max(...xs),t]}).sort((x,y)=>x[0]-y[0]);r.pos=pos;return r})}
function seqStr(r,o1,o2,g,full){let parts=[`стена | отступ ${fm(o1)}`],cnt=0;
 const flush=()=>{if(cnt){parts.push(`шов ${fm(g)} + плитка ${fm(full)}`+(cnt>1?` ×${cnt}`:''));cnt=0}};
 r.forEach(([x0,x1,t],i)=>{const w=x1-x0;if(i&&Math.abs(w-full)<0.01){cnt++;return}flush();parts.push((i?`шов ${fm(r[i][0]-r[i-1][1])} + `:'')+(Math.abs(w-full)<0.01?`плитка ${fm(w)}`:`<b>${t.g||''} ${fm(w)}</b>`))});flush();parts.push(`отступ ${fm(o2)} | стена`);return parts.join(' → ')}
function positions(tiles,c){let h='<h4>Положение на полу (точно, мм)</h4><table>';
 const sx=c.ol+c.cx,sy=c.ot+c.cy;
 if(c.seam)h+=`<tr><td>Центральный вертикальный шов</td><td>ось ${fm(sx)} от левой стены, ${fm(c.RL-sx)} от правой; кромки шва ${fm(sx-c.g/2)} и ${fm(sx+c.g/2)} от левой</td></tr><tr><td>Центральный горизонтальный шов</td><td>ось ${fm(sy)} от верхней стены, ${fm(c.RW-sy)} от нижней; кромки ${fm(sy-c.g/2)} и ${fm(sy+c.g/2)} от верхней</td></tr>`;
 else h+=`<tr><td>Центр центральной плитки</td><td>${fm(sx)} от левой, ${fm(c.RL-sx)} от правой, ${fm(sy)} от верхней, ${fm(c.RW-sy)} от нижней стены</td></tr>`;
 if(c.diag){h+=`<tr><td>Швы</td><td>сетка повёрнута на ${c.AN}° по часовой вокруг этой точки; шаг ${fm(c.a+c.g)} вдоль длины и ${fm(c.b+c.g)} вдоль ширины</td></tr></table>`;return h}
 h+='</table>';
 const uniq=(rs,ax)=>{const m=new Map();rs.forEach((r,i)=>{const s=seqStr(r,ax?c.ol:c.ot,ax?c.or:c.ob,c.g,ax?c.a:c.b);(m.get(s)||m.set(s,[]).get(s)).push(ax?i+1:fm((ax?c.ot:c.ol)+r.pos))});return m};
 const R=rowsOf(tiles,1),Cc=rowsOf(tiles,0);
 h+='<div class="mu">Ряды (сверху вниз), слева направо:</div>';for(const[s,ids]of uniq(R,1))h+=`<div class="seq"><b>Ряды ${ids.join(', ')}:</b> ${s}</div>`;
 h+='<div class="mu">По вертикали сверху вниз (линия на X мм от левой стены):</div>';for(const[s,ids]of uniq(Cc,0))h+=`<div class="seq"><b>X = ${ids.length>4?ids.slice(0,3).join(', ')+' … ('+ids.length+' линий)':ids.join(', ')}:</b> ${s}</div>`;
 return h}
function verify(tiles,c){const res=[];const ok=(n,b,d)=>res.push([n,b,d]);const T=1e-6;
 if(!c.diag){for(const ax of[1,0]){const rs=rowsOf(tiles,ax),tot=ax?c.RL:c.RW,o1=ax?c.ol:c.ot,o2=ax?c.or:c.ob;let bad=0,gapBad=0;
  for(const r of rs){let s=o1+o2;r.forEach(([x0,x1],i)=>{s+=x1-x0;if(i){const gp=x0-r[i-1][1];s+=gp;if(Math.abs(gp-c.g)>T)gapBad++}});if(Math.abs(r[0][0])>T||Math.abs(r[r.length-1][1]-(ax?c.W:c.H))>T)bad++;if(Math.abs(s-tot)>T)bad++}
  ok(`${ax?'Каждый ряд (горизонталь)':'Каждая вертикаль'}: отступ + плитки + швы + куски + отступ = ${tot} мм (${rs.length} линий)`,!bad,bad?bad+' ошибок':'');
  ok(`${ax?'По горизонтали':'По вертикали'}: все швы ровно ${fm(c.g)} мм`,!gapBad,'')}}
 if(c.diag){let miss=0;const key=t=>Math.round(t.cx*100)+','+Math.round(t.cy*100);const set=new Map(tiles.map(t=>[key(t),t]));
  for(const t of tiles){const m=set.get(Math.round((2*c.cx-t.cx)*100)+','+Math.round((2*c.cy-t.cy)*100));if(!m||Math.abs(m.ar-t.ar)>0.01)miss++}
  ok('Симметрия относительно центра: у каждого куска есть равный напротив',miss?(c.sh?'w':false):true,miss?miss+' без пары'+(c.sh?' — при укладке вразбежку с поворотом ряды по разные стороны центрального шва сдвинуты по-разному (свойство раскладки). Полная симметрия: «Центр по плитке» с 1/2, или «Прямая».':''):'')}
 else for(const ax of[1,0]){let bad=0;const rs=rowsOf(tiles,ax);for(const r of rs){const l=r[0][1]-r[0][0],q=r[r.length-1][1]-r[r.length-1][0];if(Math.abs(l-q)>T)bad++}
  ok(ax?'На каждой горизонтали подрезка у левой и правой стены одинаковая':'На каждой вертикали подрезка у верхней и нижней стены одинаковая',bad?(c.sh>0.3&&c.sh<0.34?'w':false):true,bad?`${bad} из ${rs.length} не равны${c.sh?' — при смещении 1/3 соседние ряды сдвинуты на 1/3 и 2/3, поэтому слева и справа куски разные (это свойство раскладки, не ошибка расчёта); для полной симметрии выберите «Прямая» или «1/2»':''}`:'')}
 let outB=0;for(const t of tiles)for(const p of t.loc)if(p[0]<-0.01||p[1]<-0.01||p[0]>c.TA+0.01||p[1]>c.TB+0.01)outB++;
 ok('Каждый кусок лежит в пределах своей плитки',!outB,'');
 let outR=0;for(const t of tiles)for(const p of t.p)if(p[0]<-T||p[1]<-T||p[0]>c.W+T||p[1]>c.H+T)outR++;ok('Все куски внутри рабочей площади',!outR,'');
 const sumA=tiles.reduce((s,t)=>s+t.ar,0);ok(`Площадь плитки ${fm(sumA/100)} см² ≤ рабочей ${fm(c.W*c.H/100)} см² (остальное — швы)`,sumA<=c.W*c.H+1,'');
 const allOk=res.every(r=>r[1]!==false);
 return`<h4>Автопроверка расчёта ${allOk?'✅':'❌'}</h4><table>`+res.map(([n,b,d])=>`<tr><td>${n}${b==='w'?'<br><span class=mu>'+d+'</span>':''}</td><td>${b===true?'✅':b==='w'?'⚠️':'❌ '+d}</td></tr>`).join('')+'</table>'}
function lod(){if(!VB)return;const s=toSvg(0,0)[2];const on=new Set();
 document.querySelectorAll('#sv .ar').forEach(g=>{const v=g.dataset.f/s>=9;g.style.display=v?'':'none';if(v)on.add(g.dataset.pid)});
 document.querySelectorAll('#sv .lt').forEach(t=>t.style.display=on.has(t.dataset.pid)?'none':'')}

// ---- v8 helpers
function optimise(P,TA,TB,kf){// guillotine reuse of rectangular offcuts
 const pcs=P.map(p=>p.rect?[p.du,p.dv]:null);if(pcs.some(x=>!x))return null;
 pcs.sort((x,y)=>y[0]*y[1]-x[0]*x[1]);const free=[];let tiles=0,reused=0;const plan=[];
 for(const[w,h]of pcs){let bi=-1,bs=Infinity,rot=false;
  free.forEach((f,i)=>{for(const r of[false,true]){const W=r?h:w,H=r?w:h;if(W<=f[0]+1e-9&&H<=f[1]+1e-9){const s=f[0]*f[1];if(s<bs){bs=s;bi=i;rot=r}}}});
  let f;if(bi<0){tiles++;f=[TA,TB]}else{f=free.splice(bi,1)[0];reused++}
  const W=rot?h:w,H=rot?w:h;plan.push({w,h,from:bi<0?'новая плитка':`обрезок ${fm(f[0])}×${fm(f[1])}`});
  // split: right strip and bottom strip (guillotine)
  const rw=f[0]-W-kf,bh=f[1]-H-kf;if(rw>=20)free.push([rw,f[1]]);if(bh>=20)free.push([W,bh])}
 return{tiles,reused,plan}}
function cutMap(groups,opt,TA,TB){const key='tileDone:'+location.search.length+JSON.stringify([S.rl,S.rw,S.tl,S.tw,S.gj,S.ot,S.ob,S.ol,S.or,S.ty,S.cm,S.ang]);const done=JSON.parse(localStorage.getItem(key)||'{}');
 window._dk=key;
 const gs=groups.slice().sort((x,y)=>x.A.rect===y.A.rect?(x.A.rect?(TA-x.A.du)-(TA-y.A.du)||(TB-x.A.dv)-(TB-y.A.dv):y.A.area-x.A.area):x.A.rect?-1:1);
 let h='<h4>Карта резки — по порядку, отмечайте готовое</h4><div class="mu">Порядок: сначала прямые резы, сгруппированы по одной установке упора пилы.</div>';
 h+=gs.map((g,i)=>{const A=g.A,ck=done[g.L];const what=A.rect?`отрезать ${TA-A.du>0.25?fm(TA-A.du)+' по длине':''}${TA-A.du>0.25&&TB-A.dv>0.25?' и ':''}${TB-A.dv>0.25?fm(TB-A.dv)+' по ширине':''} → кусок ${fm(A.du)}×${fm(A.dv)}`:`косой кусок, резов ${A.Ed.filter(e=>e.cut).length}: `+A.Ed.filter(e=>e.cut).map(e=>`${A.V[e.i].d} → ${A.V[e.j].d}`).join('; ');
  return`<label class="cm${ck?' done':''}"><input type="checkbox" data-l="${g.L}" ${ck?'checked':''} onchange="markDone(this)"><span><b>${i+1}. [${g.L}] ×${g.n}</b> — ${what}</span></label>`}).join('');
 if(opt&&opt.reused)h+=`<div class="mu" style="margin-top:8px">♻️ Обрезки: ${opt.reused} кусков можно выпилить из отходов других резов (учтён пропил). Порядок: режьте крупные куски первыми, остаток откладывайте с подписью размера.</div>`;
 return h}
function markDone(c){const d=JSON.parse(localStorage.getItem(window._dk)||'{}');d[c.dataset.l]=c.checked;localStorage.setItem(window._dk,JSON.stringify(d));c.parentElement.classList.toggle('done',c.checked)}
function shareURL(){const p=new URLSearchParams();F.concat('cm','ang').forEach(k=>p.set(k,S[k]));p.set('tab','1');return location.origin+location.pathname+'?'+p}
async function shareLink(){const u=shareURL();try{if(navigator.share)await navigator.share({title:'Раскладка плитки',url:u});else{await navigator.clipboard.writeText(u);alert('Ссылка скопирована:\n'+u)}}catch(e){prompt('Ссылка:',u)}}
function exportPNG(){const s=$('sv').cloneNode(true);s.setAttribute('viewBox',base.join(' '));s.setAttribute('xmlns','http://www.w3.org/2000/svg');s.querySelectorAll('.ar').forEach(e=>e.remove());s.querySelectorAll('.lt').forEach(e=>e.style.display='');
 const W=2000,H=Math.round(W*base[3]/base[2]);s.setAttribute('width',W);s.setAttribute('height',H);
 const img=new Image();img.onload=()=>{const leg=CUR.groups.map(g=>`${g.L}: ${g.A.rect?fm(g.A.du)+'×'+fm(g.A.dv):g.A.Ed.map(e=>fm(e.len)).join('/')} — ${g.n} шт`);
  const lh=40,c=document.createElement('canvas');c.width=W;c.height=H+80+leg.length*lh;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,W,H);
  x.fillStyle='#111';x.font='bold 34px sans-serif';x.fillText(`Комната ${S.rl}×${S.rw}, плитка ${S.tl}×${S.tw}, шов ${S.gj}, поворот ${S.ang}°`,30,H+50);x.font='30px sans-serif';leg.forEach((t,i)=>x.fillText(t,30,H+100+i*lh));
  const a=document.createElement('a');a.download='raskladka.png';a.href=c.toDataURL('image/png');a.click()};
 img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(s))}
function rooms(){return JSON.parse(localStorage.getItem('tileRooms')||'{}')}
function fillRooms(){const r=rooms();$('rsel').innerHTML='<option value="">— сохранённые —</option>'+Object.keys(r).map(k=>`<option>${k.replace(/</g,'&lt;')}</option>`).join('')}
$('rsave').onclick=()=>{const nm=$('rname').value.trim();if(!nm)return alert('Введите название');const r=rooms();r[nm]=Object.assign({},S);localStorage.setItem('tileRooms',JSON.stringify(r));fillRooms();$('rsel').value=nm};
$('rload').onclick=()=>{const r=rooms()[$('rsel').value];if(!r)return;Object.assign(S,r);F.forEach(k=>$(k).value=S[k]);$('ang').value=S.ang;$('rname').value=$('rsel').value;VB=null;upd()};
$('rdel').onclick=()=>{const k=$('rsel').value;if(!k||!confirm('Удалить «'+k+'»?'))return;const r=rooms();delete r[k];localStorage.setItem('tileRooms',JSON.stringify(r));fillRooms()};
fillRooms();

// pan/zoom
const sv=$('sv'),pts=new Map();let last=null;
function toSvg(x,y){const r=sv.getBoundingClientRect(),v=VB.v,s=Math.max(v[2]/r.width,v[3]/r.height);
 return[v[0]+(x-r.left-(r.width-v[2]/s)/2)*s,v[1]+(y-r.top-(r.height-v[3]/s)/2)*s,s]}
let TP=null;sv.addEventListener('pointerdown',e=>{TP=pts.size?null:[e.clientX,e.clientY];sv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);last=null});
sv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const pr=pts.get(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
 const v=VB.v;if(pts.size===1){const s=toSvg(0,0)[2];v[0]-=(e.clientX-pr[0])*s;v[1]-=(e.clientY-pr[1])*s}
 else if(pts.size===2){const[p1,p2]=[...pts.values()],d=Math.hypot(p1[0]-p2[0],p1[1]-p2[1]),m=[(p1[0]+p2[0])/2,(p1[1]+p2[1])/2];
  if(last){zoom(m,last.d/d);const s=toSvg(0,0)[2];v[0]-=(m[0]-last.m[0])*s;v[1]-=(m[1]-last.m[1])*s}last={d,m}}
 sv.setAttribute('viewBox',v.join(' '));lod()});
const up=e=>{if(TP&&pts.size===1&&Math.hypot(e.clientX-TP[0],e.clientY-TP[1])<8&&CUR){const[x,y]=toSvg(e.clientX,e.clientY),X=x-CUR.ol,Y=y-CUR.ot;const t=CUR.cuts.find(t=>inPoly([X,Y],t.p));if(t)detail(t.g)}TP=null;pts.delete(e.pointerId);last=null};
function inPoly(p,q){let c=false;for(let i=0,j=q.length-1;i<q.length;j=i++){const a=q[i],b=q[j];if((a[1]>p[1])!=(b[1]>p[1])&&p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])c=!c}return c}sv.addEventListener('pointerup',up);sv.addEventListener('pointercancel',up);
function zoom(m,f){const v=VB.v,[x,y]=toSvg(m[0],m[1]);f=Math.max(Math.min(f,base[2]*1.5/v[2]),40/v[2]);
 v[0]=x-(x-v[0])*f;v[1]=y-(y-v[1])*f;v[2]*=f;v[3]*=f}
sv.addEventListener('wheel',e=>{e.preventDefault();zoom([e.clientX,e.clientY],e.deltaY>0?1.15:0.87);sv.setAttribute('viewBox',VB.v.join(' '));lod()},{passive:false});
$('zr').onclick=()=>{VB.v=base.slice();sv.setAttribute('viewBox',VB.v.join(' '));lod()};
addEventListener('resize',upd);tab(TAB);
if(Q.has('z')){const r=sv.getBoundingClientRect();zoom([r.left+r.width*(+Q.get('zx')||0.15),r.top+r.height*(+Q.get('zy')||0.2)],1/+Q.get('z'));sv.setAttribute('viewBox',VB.v.join(' '));lod();setTimeout(lod,400)}
if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>lod()).observe(sv);
if(Q.has('d'))detail(Q.get('d'));
