<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Раскладка плитки</title>
<style>
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}
body{font-family:system-ui,-apple-system,Roboto,sans-serif;background:#f2f3f5;color:#222;font-size:16px}
header{background:#2b5d8a;color:#fff;padding:12px 14px;font-size:18px;font-weight:600}
details{background:#fff;margin:8px;border-radius:12px;box-shadow:0 1px 3px #0002}
summary{padding:14px;font-weight:600;font-size:17px;cursor:pointer}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px}
.g h4{grid-column:1/-1;margin:6px 0 0;font-size:14px;color:#2b5d8a}
label{display:flex;flex-direction:column;font-size:13px;color:#555;gap:4px}
input,select{font-size:18px;padding:10px;border:1px solid #bbb;border-radius:8px;width:100%;min-width:0;background:#fff}
.full{grid-column:1/-1}
.seg{display:flex;gap:6px}.seg button{flex:1;font-size:15px;padding:10px;border:1px solid #2b5d8a;background:#fff;color:#2b5d8a;border-radius:8px}
.seg button.on{background:#2b5d8a;color:#fff}
#wrap{margin:8px;background:#fff;border-radius:12px;box-shadow:0 1px 3px #0002;overflow:hidden;position:relative}
input[type=range]{accent-color:#2b5d8a}input[type=range]::-webkit-slider-thumb{width:34px;height:34px}
svg{display:block;width:100%;touch-action:none;background:#e9e3d6}
#zr{position:absolute;right:8px;top:8px;font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid #888;background:#fffd}
.card{background:#fff;margin:8px;border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px #0002;font-size:15px}
.card table{width:100%;border-collapse:collapse}.card td{padding:4px 2px;border-bottom:1px solid #eee}
.warn{background:#fff3cd;border-left:4px solid #e0a800;padding:8px 10px;margin:8px 0;border-radius:6px}
.lg span{display:inline-block;width:14px;height:14px;vertical-align:middle;margin:0 4px 0 8px;border:1px solid #666}
.hint{font-size:12px;color:#777;padding:4px 10px}
</style></head><body>
<header>Раскладка плитки — шов по центру <small style="opacity:.6;font-size:11px">v4</small></header>
<details id="inp" open><summary>Параметры (мм)</summary><div class="g">
<h4>Помещение</h4>
<label>Длина (по горизонтали)<input id="rl" inputmode="numeric"></label>
<label>Ширина (по вертикали)<input id="rw" inputmode="numeric"></label>
<h4>Плитка</h4>
<label>Длина плитки<input id="tl" inputmode="numeric"></label>
<label>Ширина плитки<input id="tw" inputmode="numeric"></label>
<label>Шов<input id="gj" inputmode="decimal"></label>
<label>Запас, %<input id="rs" inputmode="numeric"></label>
<h4>Отступы от стен</h4>
<label>Сверху<input id="ot" inputmode="numeric"></label>
<label>Снизу<input id="ob" inputmode="numeric"></label>
<label>Слева<input id="ol" inputmode="numeric"></label>
<label>Справа<input id="or" inputmode="numeric"></label>
<h4>Укладка</h4>
<label class="full">Тип<select id="ty"><option value="0">Прямая</option><option value="0.5">Вразбежку 1/2</option><option value="0.3333333">Вразбежку 1/3</option></select></label>
<div class="full" style="font-size:14px;color:#555">Поворот плитки: <b id="angv" style="font-size:18px;color:#2b5d8a">0°</b>
<input type="range" id="ang" min="0" max="90" step="1" style="padding:0;height:44px;border:0">
<div class="seg" id="angq"><button data-a="0">0°</button><button data-a="45">45° (диагональ)</button><button data-a="90">90°</button></div></div>
<div class="full seg" id="cm"><button data-v="seam">Центр по шву</button><button data-v="tile">Центр по плитке</button></div>
</div></details>
<div id="wrap"><button id="zr">⤢ Сброс</button><svg id="sv"></svg></div>
<div class="hint">Двумя пальцами — масштаб, одним — сдвиг. <span class="lg"><span style="background:#fafafa"></span>целая<span style="background:#f4a261"></span>подрезка<span style="background:#cfd8dc"></span>отступ</span></div>
<div class="card" id="out"></div>
<script>
const $=id=>document.getElementById(id);
const F=['rl','rw','tl','tw','gj','rs','ot','ob','ol','or','ty'];
const D={ang:0,rl:4000,rw:3000,tl:600,tw:300,gj:2,rs:10,ot:10,ob:10,ol:10,or:10,ty:'0'};
let S=Object.assign({},D,{cm:'seam'},JSON.parse(localStorage.getItem('tileApp')||'{}'));
const Q=new URLSearchParams(location.search);F.concat('cm','ang').forEach(k=>{if(Q.has(k))S[k]=Q.get(k)});
F.forEach(k=>{$(k).value=S[k];$(k).addEventListener('input',()=>{S[k]=$(k).value;upd()})});
$('ang').value=S.ang;$('ang').addEventListener('input',()=>{S.ang=$('ang').value;upd()});
document.querySelectorAll('#angq button').forEach(b=>b.onclick=()=>{S.ang=b.dataset.a;$('ang').value=S.ang;upd()});
document.querySelectorAll('#cm button').forEach(b=>b.onclick=()=>{S.cm=b.dataset.v;upd()});
if(innerWidth<600&&localStorage.getItem('tileApp'))$('inp').open=false;
const NS='http://www.w3.org/2000/svg';
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e}
function clip(poly,x0,y0,x1,y1){
 const edges=[[p=>p[0]>=x0,(a,b)=>{const t=(x0-a[0])/(b[0]-a[0]);return[x0,a[1]+t*(b[1]-a[1])]}],
 [p=>p[0]<=x1,(a,b)=>{const t=(x1-a[0])/(b[0]-a[0]);return[x1,a[1]+t*(b[1]-a[1])]}],
 [p=>p[1]>=y0,(a,b)=>{const t=(y0-a[1])/(b[1]-a[1]);return[a[0]+t*(b[0]-a[0]),y0]}],
 [p=>p[1]<=y1,(a,b)=>{const t=(y1-a[1])/(b[1]-a[1]);return[a[0]+t*(b[0]-a[0]),y1]}]];
 for(const[ins,ix]of edges){const o=[];for(let i=0;i<poly.length;i++){const c=poly[i],p=poly[(i+poly.length-1)%poly.length];
  if(ins(c)){if(!ins(p))o.push(ix(p,c));o.push(c)}else if(ins(p))o.push(ix(p,c))}poly=o;if(!poly.length)break}
 return poly}
const area=p=>{let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=a[0]*b[1]-b[0]*a[1]}return Math.abs(s)/2};
const r1=v=>Math.round(v*10)/10;
let VB=null,base=null;
function upd(){
 localStorage.setItem('tileApp',JSON.stringify(S));
 if(S.ty==='d'){S.ty='0';S.ang=45;$('ty').value='0';$('ang').value=45}
 const AN=Math.min(90,Math.max(0,+S.ang||0));$('angv').textContent=AN+'°';document.querySelectorAll('#angq button').forEach(b=>b.classList.toggle('on',+b.dataset.a==AN));
 document.querySelectorAll('#cm button').forEach(b=>b.classList.toggle('on',b.dataset.v==S.cm));
 const n=k=>Math.max(0,parseFloat(String(S[k]).replace(',','.'))||0);
 const RL=n('rl'),RW=n('rw'),R90=AN==90;let a=n('tl'),b=n('tw'),g=n('gj'),ot=n('ot'),ob=n('ob'),ol=n('ol'),or=n('or');
 const sv=$('sv');sv.innerHTML='';const out=$('out');
 const W=RL-ol-or,H=RW-ot-ob;
 if(!(RL>0&&RW>0&&a>0&&b>0&&W>0&&H>0)){out.innerHTML='<div class="warn">Проверьте размеры: все значения должны быть больше нуля, а отступы — меньше размеров комнаты.</div>';return}
 if((W/(a+g))*(H/(b+g))>20000){out.innerHTML='<div class="warn">Слишком много плиток для отрисовки.</div>';return}
 const diag=AN>0&&AN<90,sh=parseFloat(S.ty)||0,seam=S.cm==='seam';
 const px=a+g,py=b+g,cx=W/2,cy=H/2;
 const ox=seam?g/2:-a/2, oy=seam?g/2:-b/2; // tile start relative to center
 const tiles=[];
 if(!diag&&!R90){
  const j0=Math.floor((-cy-oy-b)/py)-1,j1=Math.ceil((cy-oy)/py)+1;
  for(let j=j0;j<=j1;j++){const y=cy+oy+j*py;if(y+b<=0||y>=H)continue;
   let s=((j*sh)%1+1)%1;if(s>0.5+1e-9&&sh!==0.3333333)s-=1;
   const xs=cx+ox+s*px;const k0=Math.floor((-cx-ox-a-s*px)/px)-1,k1=Math.ceil((cx-ox)/px)+1;
   for(let k=k0;k<=k1;k++){const x=xs+k*px;if(x+a<=0||x>=W)continue;
    const X0=Math.max(0,x),X1=Math.min(W,x+a),Y0=Math.max(0,y),Y1=Math.min(H,y+b);
    if(X1-X0<0.05||Y1-Y0<0.05)continue;
    tiles.push({p:[[X0,Y0],[X1,Y0],[X1,Y1],[X0,Y1]],w:X1-X0,h:Y1-Y0,cut:(X1-X0<a-0.05||Y1-Y0<b-0.05)})}}
 }else{
  const t=AN*Math.PI/180,co=Math.cos(t),si=Math.sin(t),R=Math.hypot(W,H)/2+Math.max(a,b)*2;
  for(let j=Math.floor((-R-oy)/py)-1;j<=Math.ceil((R-oy)/py)+1;j++){
   let s2=((j*sh)%1+1)%1;if(s2>0.5+1e-9&&sh!==0.3333333)s2-=1;
   for(let k=Math.floor((-R-ox-px)/px)-1;k<=Math.ceil((R-ox)/px)+1;k++){
   const u=ox+(k+s2)*px,v=oy+j*py;
   const P=[[u,v],[u+a,v],[u+a,v+b],[u,v+b]].map(([x,y])=>[cx+x*co-y*si,cy+x*si+y*co]);
   const q=clip(P,0,0,W,H);if(q.length<3)continue;const ar=area(q);if(ar<1)continue;
   const xs=q.map(p=>p[0]),ys=q.map(p=>p[1]);
   let L=0;for(let m=0;m<q.length;m++){const A=q[m],B=q[(m+1)%q.length];L=Math.max(L,Math.hypot(A[0]-B[0],A[1]-B[1]))}
   tiles.push({p:q,ar,L,cut:ar<a*b*0.999,w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys),
    mx:xs.reduce((p,c)=>p+c)/xs.length,my:ys.reduce((p,c)=>p+c)/ys.length})}}
 }
 if(R90){[a,b]=[b,a];tiles.forEach(t=>{const xs=t.p.map(p=>p[0]),ys=t.p.map(p=>p[1]);const X0=Math.min(...xs),Y0=Math.min(...ys);t.p=[[X0,Y0],[X0+t.w,Y0],[X0+t.w,Y0+t.h],[X0,Y0+t.h]];t.cut=t.w<a-0.05||t.h<b-0.05})}
 // draw
 const pad=Math.max(RL,RW)*0.16;base=[-pad,-pad,RL+2*pad,RW+2*pad];
 if(!VB||VB.key!==RL+'x'+RW){VB={v:base.slice(),key:RL+'x'+RW}}
 sv.setAttribute('viewBox',VB.v.join(' '));
 sv.style.height=Math.min(innerHeight*0.65,sv.clientWidth*base[3]/base[2]||400)+'px';
 const sc=Math.max(RL,RW)/1000;
 el('rect',{x:0,y:0,width:RL,height:RW,fill:'#cfd8dc',stroke:'#333','stroke-width':4*sc},sv);
 const df=Math.max(RL,RW)*0.03,dk='#1d3557';
 const dm=el('defs',{},sv),m2k=el('marker',{id:'dh',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse',markerUnits:'userSpaceOnUse'},dm);
 m2k.setAttribute('markerWidth',df*0.5);m2k.setAttribute('markerHeight',df*0.5);el('path',{d:'M0,0L10,5L0,10z',fill:dk},m2k);
 function dim(x1,y1,x2,y2,txt,side){const L=Math.hypot(x2-x1,y2-y1);if(L<=0)return;const vert=x1===x2;
  el('line',{x1,y1,x2,y2,stroke:dk,'stroke-width':df*0.06,'marker-start':L>df?'url(#dh)':'','marker-end':L>df?'url(#dh)':''},sv);
  // extension ticks
  for(const[x,y]of[[x1,y1],[x2,y2]])el('line',Object.assign(vert?{x1:x-df*0.3,y1:y,x2:x+df*0.3,y2:y}:{x1:x,y1:y-df*0.3,x2:x,y2:y+df*0.3},{stroke:dk,'stroke-width':df*0.06}),sv);
  let mx=(x1+x2)/2,my=(y1+y2)/2;const small=L<df*txt.length*0.7;
  if(vert){mx-=df*0.45*side;if(small)my=side>0?y1-df*1.2:y2+df*1.2}else{my-=df*0.45*side;if(small)mx=side>0?x1-df*1.2:x2+df*1.2}
  const e=el('text',{x:mx,y:my,'font-size':df,'text-anchor':'middle','dominant-baseline':'central',fill:dk,'font-weight':600},sv);e.textContent=txt;
  if(vert)e.setAttribute('transform',`rotate(-90 ${mx} ${my})`)}
 const o1=pad*0.35,o2=pad*0.75;
 dim(0,-o2,RL,-o2,String(RL),1);
 dim(0,-o1,ol,-o1,String(ol),1);dim(ol,-o1,RL-or,-o1,String(r1(W)),1);dim(RL-or,-o1,RL,-o1,String(or),-1);
 dim(-o2,0,-o2,RW,String(RW),1);
 dim(-o1,0,-o1,ot,String(ot),1);dim(-o1,ot,-o1,RW-ob,String(r1(H)),1);dim(-o1,RW-ob,-o1,RW,String(ob),-1);
 dim(RL+o1,0,RL+o1,ot,String(ot),-1);dim(RL+o1,RW-ob,RL+o1,RW,String(ob),-1);
 dim(0,RW+o1,ol,RW+o1,String(ol),-1);dim(RL-or,RW+o1,RL,RW+o1,String(or),-1);
 const G=el('g',{transform:`translate(${ol},${ot})`},sv);
 el('rect',{x:0,y:0,width:W,height:H,fill:'#9e9e9e'},G);
 const fs=Math.max(Math.min(a,b)*0.22,Math.max(RL,RW)*0.024);
 for(const t of tiles){el('polygon',{points:t.p.map(p=>p.join(',')).join(' '),fill:t.cut?'#f4a261':'#fafafa',stroke:'#777','stroke-width':0.6*sc},G)}
 const fmin=Math.max(RL,RW)*0.004,ANr=diag?AN*Math.PI/180:0,D1=[Math.cos(ANr),Math.sin(ANr)],D2=[-D1[1],D1[0]];
 const defs=el('defs',{},sv);const mk=el('marker',{id:'ah',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:5,markerHeight:5,orient:'auto-start-reverse',markerUnits:'strokeWidth'},defs);el('path',{d:'M0,0L10,5L0,10z',fill:'#123'},mk);
 function chord(q,c,d){let lo=Infinity,hi=-Infinity;for(let m=0;m<q.length;m++){const A=q[m],B=q[(m+1)%q.length],ex=B[0]-A[0],ey=B[1]-A[1];
   const den=d[0]*ey-d[1]*ex;if(Math.abs(den)<1e-9)continue;const t=((A[0]-c[0])*ey-(A[1]-c[1])*ex)/den,u=((A[0]-c[0])*d[1]-(A[1]-c[1])*d[0])/den;
   if(u>=-1e-6&&u<=1+1e-6){lo=Math.min(lo,t);hi=Math.max(hi,t)}}return hi>lo?[lo,hi]:null}
 function dimArrow(q,c,d,other){const ch=chord(q,c,d);if(!ch)return;const L=ch[1]-ch[0];if(L<1)return;
  const txt=String(Math.round(L));const f=Math.min(fs,L*0.6/(txt.length*0.6+0.6),other*0.4);if(f<fmin)return;
  const p1=[c[0]+d[0]*ch[0],c[1]+d[1]*ch[0]],p2=[c[0]+d[0]*ch[1],c[1]+d[1]*ch[1]];
  el('line',{x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1],stroke:'#123','stroke-width':f*0.07,'marker-start':'url(#ah)','marker-end':'url(#ah)'},G);
  let ang=Math.atan2(d[1],d[0])*180/Math.PI;if(ang>90.01)ang-=180;if(ang<=-90.01)ang+=180;
  const mx=(p1[0]+p2[0])/2,my=(p1[1]+p2[1])/2;
  const e=el('text',{x:mx,y:my,'font-size':f,'text-anchor':'middle','dominant-baseline':'central',fill:'#000',stroke:'#fff','stroke-width':f*0.25,'paint-order':'stroke','font-weight':600,transform:`rotate(${ang} ${mx} ${my})`},G);e.textContent=txt}
 let ref=null,rd=Infinity;
 for(const t of tiles){const xs=t.p.map(p=>p[0]),ys=t.p.map(p=>p[1]);t.cx=xs.reduce((p,c)=>p+c)/xs.length;t.cy=ys.reduce((p,c)=>p+c)/ys.length;
  if(!t.cut){const dd=Math.hypot(t.cx-cx,t.cy-cy);if(dd<rd){rd=dd;ref=t}}}
 for(const t of tiles){if(!t.cut&&t!==ref)continue;
  const c2=chord(t.p,[t.cx,t.cy],D2),c1=chord(t.p,[t.cx,t.cy],D1);if(!c1||!c2)continue;
  const l1=c1[1]-c1[0],l2=c2[1]-c2[0];
  // arrow along D1 shifted along D2 by 25% of l2, and vice versa
  const s2=(c2[0]+c2[1])/2-l2*0.25,s1=(c1[0]+c1[1])/2+l1*0.25;
  dimArrow(t.p,[t.cx+D2[0]*s2,t.cy+D2[1]*s2],D1,l2);
  dimArrow(t.p,[t.cx+D1[0]*s1,t.cy+D1[1]*s1],D2,l1)}
 el('line',{x1:cx,y1:-ot,x2:cx,y2:H+ob,stroke:'#d00','stroke-width':3*sc,'stroke-dasharray':`${20*sc} ${10*sc}`},G);
 el('line',{x1:-ol,y1:cy,x2:W+or,y2:cy,stroke:'#d00','stroke-width':3*sc,'stroke-dasharray':`${20*sc} ${10*sc}`},G);
 // summary
 const full=tiles.filter(t=>!t.cut).length,cuts=tiles.filter(t=>t.cut);
 const grp={};
 for(const t of cuts){let key;
  if(diag)key=`кусок ≈${Math.round(t.w)}×${Math.round(t.h)} (габарит), длинная сторона ${Math.round(t.L)}`;
  else{const cw=t.w<a-0.05,ch=t.h<b-0.05;
   key=cw&&ch?`угол ${r1(t.w)}×${r1(t.h)} (отпилить ${r1(a-t.w)} по длине и ${r1(b-t.h)} по ширине)`:
   cw?`${r1(t.w)}×${b} — отпилить ${r1(a-t.w)} мм по длине`:`${a}×${r1(t.h)} — отпилить ${r1(b-t.h)} мм по ширине`}
  grp[key]=(grp[key]||0)+1}
 const tot=tiles.length,rs=n('rs'),need=Math.ceil(tot*(1+rs/100));
 const m2=W*H/1e6;
 let h=`<table><tr><td>Плитка</td><td><b>${a}×${b}</b>, поворот ${AN}°</td></tr><tr><td>Рабочая площадь</td><td><b>${r1(W)}×${r1(H)} мм</b> (${m2.toFixed(2)} м²)</td></tr>
 <tr><td>Целых плиток</td><td><b>${full}</b></td></tr><tr><td>Подрезанных</td><td><b>${cuts.length}</b></td></tr>
 <tr><td>Всего мест</td><td><b>${tot}</b></td></tr><tr><td>Купить с запасом ${rs}%</td><td><b>${need} шт</b></td></tr></table>`;
 h+='<h4>Подрезка (размер куска → сколько отпилить)</h4><table>'+Object.entries(grp).map(([k,v])=>`<tr><td>${k}</td><td><b>${v} шт</b></td></tr>`).join('')+'</table>';
 if(!diag){const ew=Math.min(...cuts.filter(t=>t.w<a-0.05).map(t=>t.w),a),eh=Math.min(...cuts.filter(t=>t.h<b-0.05).map(t=>t.h),b);
  if(ew<a/3)h+=`<div class="warn">Узкая подрезка у левой/правой стены: ${r1(ew)} мм (меньше 1/3 плитки). ${seam?'Попробуйте «Центр по плитке».':'Попробуйте «Центр по шву».'}</div>`;
  if(eh<b/3)h+=`<div class="warn">Узкая подрезка у верхней/нижней стены: ${r1(eh)} мм (меньше 1/3 плитки). ${seam?'Попробуйте «Центр по плитке».':'Попробуйте «Центр по шву».'}</div>`;
  if(sh)h+='<div class="hint">При укладке вразбежку часть подрезок в рядах разная — смотрите подписи на схеме.</div>'}
 else h+=`<div class="hint">Поворот ${AN}°: подрезки — косые куски (размер — габарит и длинная сторона), расход больше; рекомендуется запас 15%.</div>`;
 h+='<div class="hint">Красные пунктиры — центральные оси. Стрелки — размеры куска в мм по осям плитки; на одной целой плитке у центра — эталонный размер. Мелкие куски без подписи есть в списке.</div>';
 out.innerHTML=h}
// pan/zoom
const sv=$('sv'),pts=new Map();let last=null;
function toSvg(x,y){const r=sv.getBoundingClientRect(),v=VB.v,s=Math.max(v[2]/r.width,v[3]/r.height);
